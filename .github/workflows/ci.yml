name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Multi-Platform Test & Validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify CLI Execution
        run: |
          bun ./bin/cli.js --help
          bun ./bin/cli.js --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies & Build Tools
        run: |
          python3 -m pip install --upgrade pip
          pip install pyyaml setuptools wheel

      - name: Verify Python Package Install & Import
        run: |
          pip install -e .
          python3 -c "import agentic_workflow; print('AgenticWorkflow import OK:', agentic_workflow.__version__)"
          python3 -m agentic_workflow.cli --help

      - name: Verify Skills.sh & Plugin Manifests
        run: |
          python3 -c "
          import json
          s = json.load(open('.skills.json'))
          assert s['name'] == 'agentic-workflow', 'Invalid name in .skills.json'
          assert 'repository' in s, 'Missing repository in .skills.json'
          m = json.load(open('marketplace.json'))
          assert m['name'] == 'agentic-workflow', 'Invalid name in marketplace.json'
          print('✅ All multi-agent distribution manifests verified!')
          "

      - name: Run Clean Code Guard Audit
        run: |
          bun ./bin/cli.js guard core

      - name: Run Test Suite via CLI
        run: |
          bun ./bin/cli.js test

      - name: Verify 100% English Purity (0 Hangul)
        run: |
          python3 -c "
          import os, re
          hangul = re.compile(r'[\uac00-\ud7a3\u1100-\u11ff\u3130-\u318f\ua960-\ua97f\ud7b0-\ud7ff]')
          violations = []
          for root, dirs, files in os.walk('.'):
              if any(x in root for x in ['.git', 'node_modules', 'dist', 'build', '.traces', '.fable']):
                  continue
              for f in files:
                  if any(f.endswith(ext) for ext in ['.pdf', '.png', '.jpg', '.pyc', '.tar.gz', '.whl', '.zip', '.tgz', '.lock']):
                      continue
                  p = os.path.join(root, f)
                  try:
                      with open(p, 'r', encoding='utf-8', errors='ignore') as file:
                          for i, line in enumerate(file):
                              if hangul.search(line):
                                  violations.append((p, i+1, line.strip()))
                  except Exception:
                      pass
          if violations:
              print(f'❌ Found {len(violations)} non-English lines:')
              for p, line_no, text in violations[:10]:
                  print(f'  {p}:{line_no}: {text}')
              exit(1)
          print('✅ Pure 100% English verified across entire repository!')
          "
