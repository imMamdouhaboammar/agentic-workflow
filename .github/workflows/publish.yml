name: Publish & Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.2.0)'
        required: false
        default: 'v1.2.0'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish-npm:
    name: Publish to npm & Bun Registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies & Run Tests
        run: |
          bun install
          bun test

      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm config set //registry.npmjs.org/:_authToken "${NPM_TOKEN}"
          npm publish --access public

  publish-pypi:
    name: Build & Publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python3 -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: |
          python3 -m build

      - name: Verify package distributions
        run: |
          twine check dist/*

      - name: Publish to PyPI
        if: env.PYPI_API_TOKEN != ''
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload --username __token__ --password "${PYPI_API_TOKEN}" dist/*

  publish-docker:
    name: Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  attach-release-assets:
    name: Package Release Bundles
    runs-on: ubuntu-latest
    needs: [publish-npm, publish-pypi]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package skill tarball & zip
        run: |
          mkdir -p release-assets
          tar -czf release-assets/agentic-workflow.tar.gz \
            --exclude='.git' --exclude='node_modules' --exclude='.traces' --exclude='*.log' .
          zip -rq release-assets/agentic-workflow.zip . \
            -x '*.git*' -x '*node_modules*' -x '*.traces*' -x '*.log*'

          cd release-assets
          sha256sum agentic-workflow.tar.gz > SHA256SUMS.txt
          sha256sum agentic-workflow.zip >> SHA256SUMS.txt

      - name: Upload Release Assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/agentic-workflow.tar.gz
            release-assets/agentic-workflow.zip
            release-assets/SHA256SUMS.txt
